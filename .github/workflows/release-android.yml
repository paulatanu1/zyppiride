name: Release Android

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to match local toolchain — bump when local Flutter bumps.
          flutter-version: 3.44.4

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze lib/

      - name: flutter test
        run: flutter test

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/zyppi-release.keystore

      - name: Build release AAB
        env:
          ZYPPI_STORE_FILE: zyppi-release.keystore
          ZYPPI_STORE_PASSWORD: ${{ secrets.ZYPPI_STORE_PASSWORD }}
          ZYPPI_KEY_PASSWORD: ${{ secrets.ZYPPI_KEY_PASSWORD }}
          ZYPPI_KEY_ALIAS: ${{ secrets.ZYPPI_KEY_ALIAS }}
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Shred keystore
        if: always()
        run: rm -f android/zyppi-release.keystore
