name: CI

on:
  pull_request:
  push:
    branches: [main, phase-*]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & test (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to match local toolchain — bump when local Flutter bumps.
          flutter-version: 3.44.4
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test (with coverage)
        run: flutter test --coverage

      - name: Coverage summary
        run: |
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{
            if (lf > 0) printf "**Line coverage: %.1f%%** (%d of %d lines)\n", 100*lh/lf, lh, lf;
            else print "No coverage data produced";
          }' coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: coverage/lcov.info
          retention-days: 14

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21 (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install rules test deps
        working-directory: tests-rules
        run: npm ci || npm install

      - name: Run rules tests
        working-directory: tests-rules
        run: npm test

  functions:
    name: Cloud Functions lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21 (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install deps
        working-directory: functions
        run: npm ci || npm install

      - name: Lint
        working-directory: functions
        run: npm run lint

      - name: Test
        working-directory: functions
        run: npm test
